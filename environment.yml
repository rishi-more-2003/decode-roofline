# decode-roofline — conda environment (mirror of requirements.txt)
# ---------------------------------------------------------------------------
# Usage:
#   conda env create -f environment.yml
#   conda activate decode-roofline
#
# NOTE on torch: we install torch via pip from the CUDA 12.4 wheel index to
# match the measured machine (PyTorch 2.6.0+cu124). Do NOT swap in the
# conda-forge CPU build. See docs/00_environment.md.
# ---------------------------------------------------------------------------
name: decode-roofline
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip=24.3
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0
      - numpy==2.1.3
      - ninja==1.11.1.3
      - safetensors==0.4.5
      - transformers==4.49.0
      - huggingface-hub==0.27.1
      - sentencepiece==0.2.0
      - accelerate==1.3.0
      - pandas==2.2.3
      - matplotlib==3.9.4
      - pytest==8.3.4
      # Phase 1 only (vLLM) — Linux/WSL2 only, see requirements.txt:
      # - vllm==0.8.5
